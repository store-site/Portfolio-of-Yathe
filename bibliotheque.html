<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque — Stella Yathe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="bibliotheque.html">

<header id="site-header" class="site-header"></header>

<main>
  <section style="padding-bottom: 32px;">
    <div class="wrap">
      <p class="eyebrow">BIBLIOTHÈQUE</p>
      <h1 style="margin-top:14px;">Ressources étudiées</h1>
      <p style="margin-top:18px; color: var(--slate); max-width: 60ch;">
        Les ouvrages de référence sur lesquels je construis mes fondamentaux — avec, pour chacun, les concepts retenus et où j'en suis dans la lecture.
      </p>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="wrap">
      <div id="biblio-list" class="stack" style="gap: 0;">
        <p class="skeleton">Chargement…</p>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script>
async function init() {
  const container = document.getElementById("biblio-list");
  try {
    const items = await getBiblio();
    if (items.length === 0) {
      container.innerHTML = '<p class="empty-state">Aucune ressource publiée pour le moment.</p>';
      return;
    }
    container.innerHTML = items.map(item => `
      <div style="padding: 30px 0; border-bottom: 1px solid var(--line);">
        <div class="space-between">
          <div>
            <h3>${item.title}</h3>
            <p class="meta" style="margin-top:4px;">${item.author || ""}</p>
          </div>
          <span class="tag tag-slate">${item.progress || "en cours"}</span>
        </div>
        ${item.notes ? `<div class="article-body" style="font-size:0.98rem; margin-top:16px;">${renderMarkdownLite(item.notes)}</div>` : ""}
      </div>
    `).join("");
  } catch (e) {
    container.innerHTML = '<p class="empty-state">Impossible de charger la bibliothèque.</p>';
    console.error(e);
  }
}
init();
</script>

</body>
</html>
