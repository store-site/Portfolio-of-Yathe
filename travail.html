<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travail — Stella Yathe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="travaux.html">

<header id="site-header" class="site-header"></header>

<main>
  <section id="content" style="padding-bottom: 32px;">
    <div class="wrap">
      <p class="skeleton">Chargement…</p>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script>
async function init() {
  const container = document.getElementById("content");
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    container.innerHTML = '<div class="wrap"><p class="empty-state">Travail introuvable. <a href="travaux.html">Retour aux travaux.</a></p></div>';
    return;
  }

  try {
    const item = await getTravailById(id);
    if (!item) {
      container.innerHTML = '<div class="wrap"><p class="empty-state">Ce travail n\'existe pas ou n\'est plus publié. <a href="travaux.html">Retour aux travaux.</a></p></div>';
      return;
    }

    document.title = item.title + " — Stella Yathe";

    const tagsHtml = (item.tags || []).map(t => `<span class="tag tag-slate">${t}</span>`).join(" ");

    container.innerHTML = `
      <div class="wrap">
        <a href="travaux.html" class="meta" style="display:inline-block; margin-bottom: 24px;">← Retour aux travaux</a>
        <div class="row" style="margin-bottom: 14px; align-items:center;">
          <span class="tag">${CATEGORIES[item.category] || item.category}</span>
          <span class="meta">${formatDate(item.date)}</span>
        </div>
        <h1 style="max-width: 22ch;">${item.title}</h1>
        ${item.excerpt ? `<p class="lede" style="margin-top:20px;">${item.excerpt}</p>` : ""}
        ${tagsHtml ? `<div class="row" style="margin-top:18px;">${tagsHtml}</div>` : ""}
        <hr class="rule" style="margin: 40px 0;">
        <div class="article-body">${renderMarkdownLite(item.content)}</div>
      </div>
    `;
  } catch (e) {
    container.innerHTML = '<div class="wrap"><p class="empty-state">Erreur de chargement.</p></div>';
    console.error(e);
  }
}
init();
</script>

</body>
</html>
